<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Saber PRO</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-container">
                    <div class="logo">
                        <span class="logo-icon">🎓</span>
                    </div>
                    <h1>Sistema Saber PRO</h1>
                    <p class="subtitle">Gestión de Resultados Académicos</p>
                </div>
            </div>

            <div class="login-body">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">
                            <span class="icon">📧</span>
                            Correo Electrónico
                        </label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="ejemplo@saberpro.edu.co"
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">
                            <span class="icon">🔒</span>
                            Contraseña
                        </label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                        >
                        <small class="help-text">
                            Estudiantes: usa tu número de documento
                        </small>
                    </div>

                    <button type="submit" class="btn btn-primary" id="btnLogin">
                        <span class="btn-text">Iniciar Sesión</span>
                        <span class="btn-loader" style="display: none;">⏳ Cargando...</span>
                    </button>
                </form>

                <div id="alertMessage" class="alert" style="display: none;"></div>
            </div>

            <div class="login-footer">
                <p>© 2025 Sistema Saber PRO - Universidad</p>
                <small>Desarrollado por Felipe Pabón</small>
            </div>
        </div>

        <!-- Decoración de fondo -->
        <div class="background-decoration">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
